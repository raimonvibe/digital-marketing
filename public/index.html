<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Marketing &amp; E-commerce</title>
    <!--
      Every page of the course lives under /en/ or /nl/. This file only exists so
      that the bare domain sends visitors to whichever they are more likely to
      want; the meta refresh is the fallback for anyone without JavaScript.
    -->
    <meta http-equiv="refresh" content="0; url=/en/" />
    <link rel="canonical" href="https://digital-marketing-ten-snowy.vercel.app/en/" />

    <!--
      Link previews are repeated here rather than inherited from the /en/ page:
      this is a plain file in public/, so Next's generateMetadata never touches
      it, and scrapers do not follow the meta refresh above. Without these tags
      the bare domain pastes as a naked link.

      The origin has to be spelled out because Open Graph rejects relative
      paths, which also means NEXT_PUBLIC_SITE_URL cannot reach this file — keep
      these URLs in step with SITE_URL in lib/site.ts.
    -->
    <meta
      name="description"
      content="A personal, front-end-only course. Progress and answers are stored in this browser only — nothing is sent anywhere."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digital Marketing &amp; E-commerce" />
    <meta property="og:title" content="Digital Marketing &amp; E-commerce" />
    <meta
      property="og:description"
      content="A personal, front-end-only course. Progress and answers are stored in this browser only — nothing is sent anywhere."
    />
    <meta
      property="og:url"
      content="https://digital-marketing-ten-snowy.vercel.app/en/"
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="nl_NL" />
    <meta
      property="og:image"
      content="https://digital-marketing-ten-snowy.vercel.app/social-share2.png"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Digital Marketing &amp; E-commerce" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@raimonvibe" />
    <meta name="twitter:title" content="Digital Marketing &amp; E-commerce" />
    <meta
      name="twitter:description"
      content="A personal, front-end-only course. Progress and answers are stored in this browser only — nothing is sent anywhere."
    />
    <meta
      name="twitter:image"
      content="https://digital-marketing-ten-snowy.vercel.app/social-share2.png"
    />
    <script>
      (function () {
        var langs = navigator.languages || [navigator.language || 'en'];
        var target = '/en/';
        for (var i = 0; i < langs.length; i++) {
          var code = String(langs[i]).slice(0, 2).toLowerCase();
          if (code === 'nl') {
            target = '/nl/';
            break;
          }
          if (code === 'en') break;
        }
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 4rem auto;
        max-width: 32rem;
        padding: 0 1.5rem;
        color: #1a1915;
        background: #faf7f0;
      }
      a {
        color: #2c5aa8;
      }
    </style>
  </head>
  <body>
    <p>
      Redirecting to the course. If nothing happens, choose a language:
      <a href="/en/">English</a> · <a href="/nl/">Nederlands</a>
    </p>
  </body>
</html>
